# ---------- 版本跳轉（貼到 location / { } 內、try_files 之前）----------
#
# 重要：只在 _v 缺失時由 Nginx 補上，避免與前端 version.json 版本不一致時互相 302 死循環。
# _v 過期（舊版本號）由前端 versionCheck.js 讀 version.json 後更新。
# $app_version 必須與 dist/version.json 一致（npm run nginx-version 查看）。

set $need_v "";
if ($arg_v = "") {
    set $need_v "1";
}
if ($arg_token = "") {
    set $need_v "${need_v}2";
}
if ($need_v = "12") {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    return 302 $scheme://$host$uri?_v=$app_version;
}
if ($need_v = "1") {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    return 302 $scheme://$host$uri?token=$arg_token&_v=$app_version;
}

# 刪除以下舊配置（會導致死循環或覆蓋不全）：
#   if ($request_uri = /) { return 302 /?_v=$app_version; }
#   if ($arg_v != $app_version) { ... }   ← 不要用這個
