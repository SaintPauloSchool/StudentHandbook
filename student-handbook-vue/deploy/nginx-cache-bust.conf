# ====================================================================
# Student Handbook - 路徑版本號緩存破解（location 片段）
#
# 原理：每次發版 URL 前綴變為 /20260617111511/ ，微信視為新地址
#       不再使用 ?_v= query（容易被 HTTPS 代理吃掉導致死循環）
#
# 發版：npm run build → npm run nginx-version → 更新 $app_version → reload
# ====================================================================

# 【1】server 級（與 dist/version.json 一致）
# set $app_version "20260617111511";

# 【2】在 sp-api / sms / school-management-system / profile 等 location 之後加入：

    # 版本化路徑：/20260617111511/xxx → 實際文件 /xxx
    location ~ "^/[0-9]{14}" {
        rewrite ^/[0-9]{14}/?(.*)$ /$1 break;
        root /usr/share/nginx/student-handbook/prod/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        etag off;
        if_modified_since off;
    }

    # 非版本化路徑 → 302 到 /$app_version$request_uri（只跳一次，無 query 參數）
    location / {
        return 302 /$app_version$request_uri;
    }

# 【3】刪除所有舊的 ?_v= 相關配置（need_v / fix_v / if request_uri）
