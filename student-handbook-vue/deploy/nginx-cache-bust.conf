# ====================================================================
# Student Handbook - Nginx 版本跳轉（location / 內、try_files 之前）
#
# ★ 使用相對路徑 302，避免 HTTPS 代理下 $scheme://$host 造成死循環
# ★ 只在 _v 缺失時補上；_v 過期由前端 versionCheck.js 更新
# ★ 必須刪除所有舊的 fix_v / if ($request_uri = /) 邏輯
#
# 若仍死循環：暫時刪除本片段全部內容，只保留 try_files，先恢復訪問
# ====================================================================

set $need_v "";
if ($arg_v = "") {
    set $need_v "1";
}
if ($arg_token = "") {
    set $need_v "${need_v}2";
}
if ($need_v = "12") {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    return 302 $uri?_v=$app_version;
}
if ($need_v = "1") {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    return 302 $uri?token=$arg_token&_v=$app_version;
}
