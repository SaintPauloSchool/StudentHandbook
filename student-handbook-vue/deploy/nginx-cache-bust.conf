# ---------- 版本跳轉（貼到 location / { } 內、try_files 之前）----------

set $fix_v "";
if ($arg_v != $app_version) {
    set $fix_v "1";
}
if ($arg_token = "") {
    set $fix_v "${fix_v}2";
}
if ($fix_v = "12") {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    return 302 $scheme://$host$uri?_v=$app_version;
}
if ($fix_v = "1") {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    return 302 $scheme://$host$uri?token=$arg_token&_v=$app_version;
}

