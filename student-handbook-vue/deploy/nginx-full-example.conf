# ====================================================================
# prod (80) + dev (8082) — 方案 A-2：多版本目錄
# 發版：npm run build && npm run nginx-version → 部署 dist 到 prod/VERSION/ → reload
# ====================================================================

map $request_uri $has_any_version {
    default 0;
    "~^/\d{14}/"  1;
    "~^/\d{14}$"  1;
    "~^/\d{14}\?" 1;
}

map $request_uri $is_current_version {
    default 0;
    "~^/REPLACE_VERSION/" 1;
    "~^/REPLACE_VERSION$" 1;
    "~^/REPLACE_VERSION\?" 1;
}

map $uri $has_stacked_version {
    default 0;
    "~^/REPLACE_VERSION/\d{14}(/|$)" 1;
}

server {
    listen 80;
    server_name tals-wcapp.esp.edu.mo;

    set $app_version "REPLACE_VERSION";
    set $handbook_root /usr/share/nginx/student-handbook/prod;

    location /sp-api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        client_max_body_size 5m;
    }

    location /profile/ {
        alias /usr/local/upload/;
        if ($uri ~* \.(pdf|doc|docx|xls|xlsx|ppt|pptx|zip|rar|txt)$) {
            return 403;
        }
    }

    location = /school-management-system/index.html {
        alias /usr/share/nginx/school-management-system/prod/dist/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /school-management-system/ {
        alias /usr/share/nginx/school-management-system/prod/dist/;
        try_files $uri $uri/ /school-management-system/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /sms-api/ {
        proxy_pass http://127.0.0.1:8007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # 帶 hash 的靜態資源：長期緩存（URL 含版本號，發版即失效）
    location ~ ^/REPLACE_VERSION/assets/.+\-[a-fA-F0-9]+\.(js|css|woff2?|ttf|eot|svg|png|jpg|gif|webp|ico)$ {
        root $handbook_root;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /REPLACE_VERSION/index.html {
        root $handbook_root;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /REPLACE_VERSION/version.json {
        root $handbook_root;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 當前版本 SPA（直接讀 /prod/REPLACE_VERSION/ 目錄，不剝前綴）
    location ^~ /REPLACE_VERSION/ {
        root $handbook_root;
        try_files $uri $uri/ /REPLACE_VERSION/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        etag off;
        if_modified_since off;
    }

    # 無版本 / 舊版本 / 疊加路徑 → 重定向到當前版本
    location / {
        if ($has_any_version = 0) {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            return 302 /$app_version$request_uri;
        }

        if ($is_current_version = 0) {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            rewrite "^/\d{14}(/.*)?$" /$app_version$1 redirect;
        }

        if ($has_stacked_version = 1) {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            rewrite "^/REPLACE_VERSION/\d{14}(/.*)?$" /$app_version$1 redirect;
        }

        if ($request_uri ~ "^/REPLACE_VERSION$") {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            return 302 /REPLACE_VERSION/;
        }

        return 404;
    }
}

