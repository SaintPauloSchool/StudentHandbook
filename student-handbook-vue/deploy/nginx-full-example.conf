# ====================================================================
# prod (80) + dev (8082)
# 發版：npm run build && npm run nginx-version → 整份複製輸出 → reload
# ====================================================================

map $request_uri $already_versioned {
    default 0;
    "~^/REPLACE_VERSION/" 1;
    "~^/REPLACE_VERSION$" 1;
    "~^/REPLACE_VERSION\?" 1;
}

server {
    listen 80;
    server_name tals-wcapp.esp.edu.mo;

    set $app_version "REPLACE_VERSION";

    location /sp-api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        client_max_body_size 5m;
    }

    location /profile/ {
        alias /usr/local/upload/;
        if ($uri ~* \.(pdf|doc|docx|xls|xlsx|ppt|pptx|zip|rar|txt)$) {
            return 403;
        }
    }

    location = /school-management-system/index.html {
        alias /usr/share/nginx/school-management-system/prod/dist/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /school-management-system/ {
        alias /usr/share/nginx/school-management-system/prod/dist/;
        try_files $uri $uri/ /school-management-system/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /sms-api/ {
        proxy_pass http://127.0.0.1:8007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location / {
        if ($already_versioned = 0) {
            return 302 /$app_version$request_uri;
        }

        rewrite "^/REPLACE_VERSION/?(.*)$" /$1 break;
        root /usr/share/nginx/student-handbook/prod/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        etag off;
        if_modified_since off;
    }
}

server {
    listen 8082;
    server_name 10.32.96.55 localhost;

    set $app_version "REPLACE_VERSION";

    location /sp-api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
