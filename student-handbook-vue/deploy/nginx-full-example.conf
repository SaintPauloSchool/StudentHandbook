# ====================================================================
# prod (80) + dev (8082)
# 學生手冊前端：固定配置，發版只需覆蓋 dist，無需改 Nginx
# 緩存：index.html 禁緩存；帶 hash 的 assets 長期緩存（Vite 構建文件名含 hash）
# 前端發版：npm run build → 上傳 dist/ 覆蓋服務器目錄
# ====================================================================

server {
    listen 80;
    server_name tals-wcapp.esp.edu.mo;

    location /sp-api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        client_max_body_size 5m;
    }

    location /profile/ {
        alias /usr/local/upload/;
        if ($uri ~* \.(pdf|doc|docx|xls|xlsx|ppt|pptx|zip|rar|txt)$) {
            return 403;
        }
    }

    location = /school-management-system/index.html {
        alias /usr/share/nginx/school-management-system/prod/dist/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /school-management-system/ {
        alias /usr/share/nginx/school-management-system/prod/dist/;
        try_files $uri $uri/ /school-management-system/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /sms-api/ {
        proxy_pass http://127.0.0.1:8007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # 學生手冊：帶 hash 的靜態資源長期緩存
    location ~ ^/assets/.+\-[a-fA-F0-9]+\.(js|css|woff2?|ttf|eot|svg|png|jpg|gif|webp|ico)$ {
        root /usr/share/nginx/student-handbook/prod/dist;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        root /usr/share/nginx/student-handbook/prod/dist;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 學生手冊 SPA（根路徑，與 /sp-api、/school-management-system 等不衝突）
    location / {
        root /usr/share/nginx/student-handbook/prod/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        etag off;
        if_modified_since off;
    }
}

