# ====================================================================
# prod (80) + dev (8082)
# 發版：npm run build && npm run nginx-version → 整份複製輸出 → reload
# ====================================================================

# 任意 14 位版本前綴（發新版後舊書籤 /20260618012413 仍視為「已有版本」）
map $request_uri $has_any_version {
    default 0;
    "~^/\d{14}/"  1;
    "~^/\d{14}$"  1;
    "~^/\d{14}\?" 1;
}

map $request_uri $is_current_version {
    default 0;
    "~^/REPLACE_VERSION/" 1;
    "~^/REPLACE_VERSION$" 1;
    "~^/REPLACE_VERSION\?" 1;
}

# 當前版本後面又疊了一層舊版本號（歷史髒 URL，如 /V2/V1/）
map $uri $has_stacked_version {
    default 0;
    "~^/REPLACE_VERSION/\d{14}(/|$)" 1;
}

# ---------------------------------------------------------------------------
# 防死循環說明（三條規則互斥，且每次跳轉都「收斂」）：
#   規則 A：無版本前綴 → 加上當前版本（最多跳 1 次，結果必有版本前綴）
#   規則 B：舊版本前綴 → 替換為當前版本（僅 is_current=0，最多跳 1 次）
#   規則 C：/當前/舊版/... → /當前/...（每跳 1 次剝掉一層舊版，層數有限）
# 當前版本 URL（/REPLACE_VERSION/...）不會觸發 B，剝完後不再觸發 C。
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name tals-wcapp.esp.edu.mo;

    set $app_version "REPLACE_VERSION";

    location /sp-api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        client_max_body_size 5m;
    }

    location /profile/ {
        alias /usr/local/upload/;
        if ($uri ~* \.(pdf|doc|docx|xls|xlsx|ppt|pptx|zip|rar|txt)$) {
            return 403;
        }
    }

    location = /school-management-system/index.html {
        alias /usr/share/nginx/school-management-system/prod/dist/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /school-management-system/ {
        alias /usr/share/nginx/school-management-system/prod/dist/;
        try_files $uri $uri/ /school-management-system/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /sms-api/ {
        proxy_pass http://127.0.0.1:8007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location / {
        # A：無版本前綴 → 加上當前版本（僅跳一次）
        if ($has_any_version = 0) {
            return 302 /$app_version$request_uri;
        }

        # B：舊版本書籤 → 替換為當前版本（is_current=0 才進入，不會對當前版重定向到自己）
        if ($is_current_version = 0) {
            rewrite "^/\d{14}(/.*)?$" /$app_version$1 redirect;
        }

        # C：已疊加路徑 → 剝掉一層舊版號（每跳一次少一層，層數有限故不會死循環）
        if ($has_stacked_version = 1) {
            rewrite "^/REPLACE_VERSION/\d{14}(/.*)?$" /$app_version$1 redirect;
        }

        rewrite "^/REPLACE_VERSION/?(.*)$" /$1 break;
        root /usr/share/nginx/student-handbook/prod/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        etag off;
        if_modified_since off;
    }
}

server {
    listen 8082;
    server_name 10.32.96.55 localhost;

    set $app_version "REPLACE_VERSION";

    location /sp-api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    location /profile/ {
        alias /usr/local/upload/;
        if ($uri ~* \.(pdf|doc|docx|xls|xlsx|ppt|pptx|zip|rar|txt)$) {
            return 403;
        }
    }

    location = /school-management-system/index.html {
        alias /usr/share/nginx/school-management-system/dev/dist/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /school-management-system/ {
        alias /usr/share/nginx/school-management-system/dev/dist/;
        try_files $uri $uri/ /school-management-system/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /sms-api/ {
        proxy_pass http://127.0.0.1:8006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location / {
        if ($has_any_version = 0) {
            return 302 /$app_version$request_uri;
        }

        if ($is_current_version = 0) {
            rewrite "^/\d{14}(/.*)?$" /$app_version$1 redirect;
        }

        if ($has_stacked_version = 1) {
            rewrite "^/REPLACE_VERSION/\d{14}(/.*)?$" /$app_version$1 redirect;
        }

        rewrite "^/REPLACE_VERSION/?(.*)$" /$1 break;
        root /usr/share/nginx/student-handbook/dev/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        etag off;
        if_modified_since off;
    }
}
