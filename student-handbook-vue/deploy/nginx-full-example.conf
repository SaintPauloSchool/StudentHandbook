# ====================================================================
# prod (80) + dev (8082)
# 發版：npm run build && npm run nginx-version → 複製輸出 → reload nginx
#
# 原理：只有一個 location / ，版本號只寫在 set $app_version 一處
#       訪問 /任意路徑 → 302 /版本號/任意路徑（只跳一次）
# ====================================================================

server {
    listen 80;
    server_name tals-wcapp.esp.edu.mo;

    set $app_version "REPLACE_VERSION";

    location /sp-api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        client_max_body_size 5m;
    }

    location /profile/ {
        alias /usr/local/upload/;
        if ($uri ~* \.(pdf|doc|docx|xls|xlsx|ppt|pptx|zip|rar|txt)$) {
            return 403;
        }
    }

    location = /school-management-system/index.html {
        alias /usr/share/nginx/school-management-system/prod/dist/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /school-management-system/ {
        alias /usr/share/nginx/school-management-system/prod/dist/;
        try_files $uri $uri/ /school-management-system/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /sms-api/ {
        proxy_pass http://127.0.0.1:8007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location / {
        set $needs_redirect 1;
        if ($uri ~ "^/REPLACE_VERSION(/|$)") {
            set $needs_redirect 0;
        }
        if ($needs_redirect = 1) {
            return 302 /$app_version$request_uri;
        }

        rewrite ^/REPLACE_VERSION/?(.*)$ /$1 break;
        root /usr/share/nginx/student-handbook/prod/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        etag off;
        if_modified_since off;
    }
}

