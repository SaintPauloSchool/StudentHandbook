# 項目相關配置
sp:
  # 名稱
  name: sp
  # 版本
  version: 0.0.0
  # 版權年份
  copyrightYear: 2025
  # 實例演示開關
  demoEnabled: true
  # 文件路徑 示例（ Windows配置D:/uploadPath，Linux配置 /home/uploadPath）
  profile: C:/uploadPath
  # 獲取ip地址開關
  addressEnabled: false
  # Token配置
  token:
    # Token過期時間（天），默認7天
    expireTime: 7
    # 如果是dev開發時，請加上parentUserId數據測試，以便於調試家長學生關係相關功能
    parentUserId: e4634d7bc64afa3e3462c6d6e4f6fd74
  # app交互祕鑰
  appSecret: HVc1D4MU69UDMr1g
  # app交互時間誤差範圍(毫秒)
  apiTimeRange: 300000

# 學籍系統學生照片（由後端代理，前端不直接訪問）
student-info:
  photo:
    url-template: http://tals-stuinfo.esp.edu.mo:5222/api/v1/resources/students/{studentProfileNumber}/photo
    connect-timeout-ms: 5000
    read-timeout-ms: 10000

# 開發環境配置
server:
  # 服務器的HTTP端口，默認爲8003
  port: 8003
  servlet:
    # 應用的訪問路徑
    context-path: /sp-api
  tomcat:
    # tomcat的URI編碼
    uri-encoding: UTF-8
    # 連接數滿後的排隊數，默認爲100
    accept-count: 1000
    threads:
      # tomcat最大線程數，默認爲200
      max: 800
      # Tomcat啓動初始化的線程數，默認值10
      min-spare: 100

# 企業微信配置
wechat:
  work:
    corpId: ww04fad852e91fd490
    agentId: 1000033
    secret: I31-B5clKayPf4vNl2bibhL1ia8x4cwIc884xK888Fc
    redirectUri: https://mo-stu-sys.org-assistant.com/sp-api/wechat/oauth/callback
    # 回調配置
    callback:
      token: YWhmCsbcN5dtvkN44t5aywaOxcxDWWMO
      encodingAesKey: 4C7hzSn2qFrO1hzMIJBY5iTL7UPKFZSUwmMX9TLF80D
      corpId: wpV9pWDAAA1nyVENSNCp5_m185fWSXEg
      permanentCode: I31-B5clKayPf4vNl2bibhL1ia8x4cwIc884xK888Fc

# 日誌配置
logging:
  level:
    com.sp: debug
    org.springframework: warn

# Spring配置
spring:
  # 模板引擎
  thymeleaf:
    mode: HTML
    encoding: utf-8
    # 要用緩存
    cache: false
  # 資源信息
  messages:
    # 國際化資源文件路徑
    basename: static/i18n/messages
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  profiles:
    active: prod
  # 文件上传
  servlet:
    multipart:
      # 單個文件大小
      max-file-size: 10MB
      # 設置總上傳的文件大小
      max-request-size: 20MB
  # 服務模塊
  devtools:
    restart:
      # 熱部署開關
      enabled: true
  # 靜態資源配置
  web:
    resources:
      static-locations: classpath:/dist/,classpath:/static/
  mvc:
    throw-exception-if-no-handler-found: true
  autoconfigure:
    exclude: |
      org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration,
      org.springframework.boot.autoconfigure.web.ErrorPageRegistrarAutoConfiguration

# MyBatis
mybatis:
  # 搜索指定包別名
  typeAliasesPackage: com.sp.**.domain
  # 配置mapper的掃描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加載全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分頁插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# 防止XSS攻擊
xss:
  # 過濾開關
  enabled: true
  # 排除鏈接（多個用逗號分隔）
  excludes: /system/notice/*
  # 匹配鏈接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 防止csrf攻擊
csrf:
  # 過濾開關
  enabled: false
  # 白名單（多個用逗號分隔）
  whites: /druid

# 數據傳輸配置
data:
  transfer:
    source:
      host: 10.32.64.25
      port: 3306
      database: esp_center
      username: StuReader
      password: System4read

# Swagger配置
swagger:
  # 是否開啓swagger
  enabled: true